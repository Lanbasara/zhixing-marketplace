name: Catalog checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lanbasara/zhixing
          ref: main
          path: .source
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate catalogs and preserve release history
        run: python3 scripts/check.py --source .source --base "${BASE_SHA:-0000000000000000000000000000000000000000}"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
